name: Build macOS Applications

# Builds and tests on Apple Silicon. Developer ID signing and notarization
# activate automatically once their secrets exist; until then the build uses
# ad-hoc signatures, identical to a local `builditall_macos.sh` run.
#
# Runner note: macos-latest is arm64, so mlx-vlm installs and the idt.spec
# conditional MLX bundling is exercised. This is why the timeout is generous.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:   # invoked by release.yml on tag pushes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IDT_QUIET_CONFIG_LOG: "1"

jobs:
  build-macos:
    name: "Build + Test (Apple Silicon)"
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      # Signing and notarization each switch on only when their full set of
      # secrets exists. Missing secrets mean ad-hoc signatures and a green
      # build, never a failure on credentials that were never configured.
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      MACOS_NOTARIZE_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          imagedescriber/requirements.txt

    - name: Confirm runner architecture
      run: |
        echo "arch:  $(uname -m)"
        echo "macOS: $(sw_vers -productVersion)"
        echo "xcode: $(xcodebuild -version 2>/dev/null | head -1 || echo 'n/a')"
        if [ "$(uname -m)" != "arm64" ]; then
          echo "ERROR: expected an Apple Silicon runner (arm64), got $(uname -m)"
          exit 1
        fi

    # ------------------------------------------------------------------ #
    #  Virtual environments                                               #
    #  The build scripts hard-require these exact paths:                  #
    #    idt/build_idt.sh                 -> ../.venv/bin/activate        #
    #    imagedescriber/build_*_wx.sh     -> .venv/bin/activate           #
    # ------------------------------------------------------------------ #
    - name: Create root virtual environment (.venv)
      run: |
        python -m venv .venv
        ./.venv/bin/python -m pip install --upgrade pip
        ./.venv/bin/python -m pip install -r requirements.txt

    - name: Create ImageDescriber virtual environment
      run: |
        python -m venv imagedescriber/.venv
        ./imagedescriber/.venv/bin/python -m pip install --upgrade pip
        ./imagedescriber/.venv/bin/python -m pip install -r imagedescriber/requirements.txt

    - name: Record installed versions
      run: |
        echo "--- root .venv ---"
        ./.venv/bin/python -m pip list
        echo "--- imagedescriber/.venv ---"
        ./imagedescriber/.venv/bin/python -m pip list

    # ------------------------------------------------------------------ #
    #  Pre-build checks                                                   #
    # ------------------------------------------------------------------ #
    - name: Verify macOS build system structure
      # Non-fatal: this script currently checks for docs/BUILD_MACOS.md,
      # which does not exist in the repo, so it always exits 1.
      continue-on-error: true
      run: bash BuildAndRelease/MacBuilds/verify_macos_build_structure.sh

    - name: Syntax-check core modules
      # compileall over whole packages rather than a hand-listed set of files,
      # so this cannot rot when modules move (it was originally written against
      # scripts/workflow.py, which no longer exists).
      run: ./.venv/bin/python -m compileall -q idt_core cli shared imagedescriber

    - name: Run unit tests
      run: ./.venv/bin/python -m pytest pytest_tests/unit -v --tb=short

    - name: Run smoke tests (GUI-dependent; non-fatal)
      continue-on-error: true
      run: ./.venv/bin/python -m pytest pytest_tests/smoke -v --tb=short

    # ------------------------------------------------------------------ #
    #  Build                                                              #
    #  Activating the root venv first makes builditall's `python3` calls  #
    #  (pre_build_validation.py, validate_build.py) resolve to the venv   #
    #  interpreter that actually has pytest installed.                    #
    # ------------------------------------------------------------------ #
    - name: Build both macOS applications
      run: |
        source .venv/bin/activate
        bash BuildAndRelease/MacBuilds/builditall_macos.sh

    # ------------------------------------------------------------------ #
    #  Post-build verification                                            #
    # ------------------------------------------------------------------ #
    - name: Smoke-test the built CLI
      run: |
        set -e
        test -x idt/dist/idt
        ./idt/dist/idt version
        ./idt/dist/idt --help
        for cmd in describe export status show embed video download combine stats models prompts config; do
          echo "--- idt $cmd --help ---"
          ./idt/dist/idt "$cmd" --help > /dev/null
        done
        echo "All CLI subcommands reachable in the frozen binary."

    - name: Verify ImageDescriber.app bundle
      run: |
        set -e
        APP=imagedescriber/dist/ImageDescriber.app
        test -d "$APP"
        test -x "$APP/Contents/MacOS/ImageDescriber"
        echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")"
        echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
        echo "--- signature ---"
        codesign -dvv "$APP" 2>&1 || true
        # Ad-hoc signatures do not always pass strict verification; informational only.
        codesign --verify --verbose=2 "$APP" 2>&1 || \
          echo "NOTE: ad-hoc signature did not pass strict verify (expected until Developer ID signing lands)"

    - name: Confirm packaged output
      run: |
        set -e
        ls -la BuildAndRelease/MacBuilds/dist_all
        test -f BuildAndRelease/MacBuilds/dist_all/idt
        test -d BuildAndRelease/MacBuilds/dist_all/Applications/ImageDescriber.app

    # ------------------------------------------------------------------ #
    #  Developer ID signing                                                #
    #                                                                      #
    #  The certificate goes into a throwaway keychain in RUNNER_TEMP, never #
    #  the login keychain, and the keychain is deleted at the end of the    #
    #  job regardless of outcome.                                          #
    # ------------------------------------------------------------------ #
    - name: Import Developer ID certificate
      if: env.MACOS_SIGNING_ENABLED == 'true'
      env:
        CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/idt-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        CERT_PATH="$RUNNER_TEMP/certificate.p12"

        echo "$CERT_P12" | base64 --decode > "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        # Default keychains auto-lock after 5 minutes, which would break a
        # build partway through. 6 hours comfortably outlives the job.
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security

        # Without this, codesign triggers a GUI authorization prompt that
        # nothing can answer on a headless runner, and the job hangs.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

        security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$CERT_PATH"

        echo "Identities available for signing:"
        security find-identity -v -p codesigning "$KEYCHAIN"

    - name: Write notarization API key
      if: env.MACOS_NOTARIZE_ENABLED == 'true'
      env:
        NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      run: |
        set -euo pipefail
        echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
        chmod 600 "$RUNNER_TEMP/notary.p8"
        echo "Notarization key written."

    # Sign the standalone artifacts too, not just the copies that go into the
    # DMG. Same reasoning as the Windows build: the uploaded CLI tarball comes
    # from idt/dist, so signing only the staged copies would ship an ad-hoc
    # signed tarball alongside a properly signed DMG.
    - name: Sign standalone artifacts
      if: env.MACOS_SIGNING_ENABLED == 'true'
      env:
        IDT_SIGNING_IDENTITY: "${{ secrets.MACOS_SIGNING_IDENTITY || 'Developer ID Application: Kelly Ford (P887QF74N8)' }}"
        IDT_KEYCHAIN: ${{ runner.temp }}/idt-signing.keychain-db
      run: |
        bash BuildAndRelease/MacBuilds/sign_macos.sh \
          idt/dist/idt \
          imagedescriber/dist/ImageDescriber.app

    # ------------------------------------------------------------------ #
    #  DMG                                                                #
    #  Actions sets CI=true, so create_macos_dmg.sh skips its AppleScript  #
    #  Finder layout automatically. The DMG is functionally identical to   #
    #  a local one; only the window styling is absent.                     #
    # ------------------------------------------------------------------ #
    - name: Create DMG
      env:
        IDT_SIGN_CODE: ${{ env.MACOS_SIGNING_ENABLED == 'true' && '1' || '0' }}
        IDT_NOTARIZE: ${{ env.MACOS_NOTARIZE_ENABLED == 'true' && '1' || '0' }}
        IDT_SIGNING_IDENTITY: "${{ secrets.MACOS_SIGNING_IDENTITY || 'Developer ID Application: Kelly Ford (P887QF74N8)' }}"
        IDT_KEYCHAIN: ${{ runner.temp }}/idt-signing.keychain-db
        NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: bash BuildAndRelease/MacBuilds/create_macos_dmg.sh

    # Gatekeeper's verdict on a machine that has never seen this app. This is
    # the check that actually predicts what a user downloading the DMG sees.
    - name: Assess DMG with Gatekeeper
      if: env.MACOS_NOTARIZE_ENABLED == 'true'
      run: |
        set -euo pipefail
        DMG=$(ls BuildAndRelease/MacBuilds/dist/*.dmg | head -1)
        spctl --assess --type open --context context:primary-signature -v "$DMG"
        xcrun stapler validate "$DMG"
        echo "Gatekeeper accepts the DMG."

    - name: Verify DMG mounts and contains both apps
      run: |
        set -e
        DMG=$(ls BuildAndRelease/MacBuilds/dist/*.dmg | head -1)
        echo "Verifying $DMG"
        hdiutil verify "$DMG"
        MNT=$(mktemp -d)
        hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
        ls -la "$MNT" "$MNT/IDT"
        test -d "$MNT/IDT/ImageDescriber.app"
        test -x "$MNT/IDT/idt"
        test -L "$MNT/Applications"
        hdiutil detach "$MNT"
        echo "DMG contents verified."

    # ------------------------------------------------------------------ #
    #  Artifacts                                                          #
    #  The CLI is tarred rather than uploaded raw: upload-artifact does    #
    #  not reliably preserve the executable bit. The DMG is immune, since  #
    #  it is a filesystem image.                                          #
    # ------------------------------------------------------------------ #
    - name: Package CLI tarball
      run: |
        set -e
        VERSION=$(tr -d ' \n' < VERSION 2>/dev/null || echo "dev")
        mkdir -p artifacts
        tar -czf "artifacts/idt-macos-arm64-${VERSION}.tar.gz" -C idt/dist idt
        ls -lh artifacts BuildAndRelease/MacBuilds/dist

    - name: Upload DMG
      uses: actions/upload-artifact@v7
      with:
        name: idt-macos-arm64-dmg
        path: BuildAndRelease/MacBuilds/dist/*.dmg
        retention-days: 30

    - name: Upload IDT CLI
      uses: actions/upload-artifact@v7
      with:
        name: idt-macos-arm64-cli
        path: artifacts/idt-macos-arm64-*.tar.gz
        retention-days: 30

    # Runs even when the build fails, so a signing key never outlives the job.
    - name: Clean up signing keychain
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12" || true
        security delete-keychain "$RUNNER_TEMP/idt-signing.keychain-db" 2>/dev/null || true
        echo "Signing material removed."

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: macos-build-logs
        path: |
          idt/build/**/warn-*.txt
          imagedescriber/build/**/warn-*.txt
          wf_*/logs/*.log
        retention-days: 7
        if-no-files-found: ignore
