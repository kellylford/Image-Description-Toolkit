[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "idt"
version = "4.5.1"
description = "Image Description Toolkit — AI-powered batch image description for accessibility"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "pillow-heif>=1.4.0",
    "piexif>=1.1.3",
    "requests>=2.25.0",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "anthropic>=0.121.0",
    "beautifulsoup4>=4.15.0",
    "opencv-python>=5.0.0.93",
    "numpy>=2.4.6",
]

[project.scripts]
idt = "cli.main:main"

[tool.setuptools.packages.find]
include = ["idt_core*", "cli*"]

[tool.pytest.ini_options]
# pytest configuration for Image Description Toolkit

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test directory
testpaths = ["pytest_tests"]

# Coverage configuration
addopts = """
    -v
    --strict-markers
    --tb=short
    --cov-config=pyproject.toml
"""

# Markers for categorizing tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "regression: marks tests as regression tests for specific bugs"
]

[tool.coverage.run]
# scripts/ was emptied of Python in 2a32e6d (legacy removal) and now holds only
# JSON config. Pointing coverage at it meant every --cov run measured zero files
# and reported success -- which is how ai_providers.describe_image went nine
# months with no test at all under a fully green suite (issue #228).
source = ["idt_core", "imagedescriber", "cli"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
    "*/.winenv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

precision = 2
show_missing = true

# A ratchet, not a cliff. Set just below the measured number so it fails on a
# regression, not on the status quo, and raised as coverage lands.
#
# This only applies when a coverage report is actually produced (a --cov run).
# addopts deliberately does NOT pass --cov, so targeted runs like
# `pytest pytest_tests/unit/test_idt_core.py` are unaffected.
#
# Measured 24.86% after the GUI folder-scope tests (#230) drove the real
# ImageDescriberFrame. Was 20.12% at the #228 work, 13.48% before it, and --
# before the [tool.coverage.run] source fix -- literally nothing.
fail_under = 23

# ---------------------------------------------------------------------------
# Per-file coverage floors, enforced by tools/check_coverage_floors.py.
#
# Worth more than the global number: a global floor is satisfied by covering
# anything at all, while these name the files where a gap actually shipped a
# bug. ai_providers.py is where the nine-month Ollama retry defect lived with
# no test touching describe_image at all.
#
# Raise a floor when you add coverage. Lowering one needs a reason in the
# commit message.
# ---------------------------------------------------------------------------
[tool.idt.coverage-floors]
"imagedescriber/ai_providers.py" = 66.0
# The GUI floors exist because these numbers were 0.00% and 6.37%. They are low
# in absolute terms and still worth defending: they are what a real frame being
# constructed and a real workspace being loaded actually exercise, so a drop
# means that stopped happening.
"imagedescriber/imagedescriber_wx.py" = 18.0
"imagedescriber/viewer_components.py" = 23.0
"idt_core/gui_bridge.py" = 78.0
# Measured 86.75%. Defended because this module downloads a binary and hands it
# to os.startfile: the checksum, URL-allowlist and partial-file-cleanup paths
# must stay tested. Uncovered remainder is the platform branches that cannot run
# on the CI OS (macOS reveal, os.startfile).
"idt_core/updater.py" = 85.0
"idt_core/providers/base.py" = 100.0
# Both raised from 45/52 when issue #267 added the live-listing fetchers and
# their tests. The remaining uncovered part of each file is the provider class
# itself -- the SDK describe() call, which needs a network and a key.
# 70 rather than the ~76-78 measured, and the gap is deliberate: this file's
# number moves a few points between runs depending on whether the machine has an
# API key and a warm model cache (which decide whether the live-listing path is
# exercised at all). A floor set against the best observed run would fail on CI,
# where neither is true, for reasons unrelated to any change.
"idt_core/providers/claude.py" = 70.0
"idt_core/providers/ollama.py" = 48.0
"idt_core/providers/openai_provider.py" = 76.0
# The model catalog (issue #267): live listing merged with curated metadata.
# Floors set with the code, for the reason stated in the chat-engine note below.
# High on purpose -- these two hold the invariant that a live listing can never
# overwrite a recorded context window, and nothing else in the suite would
# notice if that broke. Uncovered remainder is defensive degradation paths.
"idt_core/providers/catalog.py" = 90.0
"idt_core/providers/model_cache.py" = 95.0
"idt_core/pipeline.py" = 82.0
"idt_core/workspace.py" = 85.0
"idt_core/project.py" = 100.0
"idt_core/image_item.py" = 96.0
# Chat engine. Floors set at the same time as the code, on purpose: a new
# module with no floor is exactly what rots, and this one backs three surfaces
# (the CLI, the standalone app, and eventually ImageDescriber's chat window).
"idt_core/chat/engine.py" = 95.0
"idt_core/chat/messages.py" = 90.0
"idt_core/chat/tokens.py" = 93.0
"idt_core/chat/events.py" = 95.0
"idt_core/chat/errors.py" = 82.0
"idt_core/chat/store.py" = 77.0
# Lower than the rest, and honestly so: roughly a third of this file is the
# three SDK streaming calls, which cannot run without a network and a key. The
# message formatters -- where the wire format is actually easy to get wrong --
# are pure functions and are covered.
"idt_core/chat/providers.py" = 62.0
"idt_core/chat/attachments.py" = 94.0
# No floor for idt_core/chat/mlx.py on purpose. It is macOS-on-Apple-Silicon
# only, so on Windows and on CI it measures 0% no matter how correct it is.
# Splitting it out of providers.py keeps that dead measurement from dragging
# down a file whose covered parts are genuinely exercised. Add a floor here
# once there is a Mac runner that can import mlx_vlm.
# Replaced five divergent key lookups; worth defending because the divergence
# was the bug (Summarize & Compact checked only the config file).
"idt_core/keys.py" = 90.0
"idt_core/providers/registry.py" = 92.0
